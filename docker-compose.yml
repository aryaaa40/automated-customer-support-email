services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: email_routing
      POSTGRES_PASSWORD: email_routing
      POSTGRES_DB: email_routing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_routing -d email_routing"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
